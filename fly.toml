# Fly.io settings for the API server. Steps: docs/manual/DEPLOY.md.
# If the app name is taken, pick another one and change it here.
app = "companion-social-api"
primary_region = "nrt" # Tokyo, next to the Supabase project

[http_service]
  internal_port = 8080
  force_https = true
  # Chat replies are written in the background after the request returns,
  # so the machine must never be stopped for being idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
