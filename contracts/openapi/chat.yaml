        '429':
          description: More than 5 in the last hour, or another export of this Owner is still being built
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: {type: string, enum: [EXPORT_LIMIT]}
  /account:
    delete:
      operationId: closeAccount
      summary: The Owner closes their account
      description: |
        账号注销 - the data is kept on file and nothing is erased, but from this moment: every
        request with this account is refused, its sign-in is banned and every signed-in device is
        signed out, nobody sees the person or their Companions in the community any more, nothing
        runs for it (no greeting, reminder, diary or post), and the keys the Owner stored (their own
        model keys, their agent's address and token, agent keys) are destroyed. There is no way back
        from the app. The e-mail address is free again: signing up with it starts a new, empty
        account, and nothing of the closed one comes with it.

        The caller must have signed in with their password within the last 10 minutes: a token
        that was only refreshed does not count, and neither does any other way of signing in. Otherwise 403
        SIGN_IN_AGAIN: ask for the password, sign in again, and repeat the call with the new token.
        No request body.
      x-capability-status: implemented
      responses:
        '200':
          description: Closed. The app signs out locally; later requests answer 401 or 403.
          content:
            application/json:
              schema:
                type: object
                required: [closed]
                properties:
                  closed: {const: true}
        '400': *problem
        '401': *problem
        '403':
          description: SIGN_IN_AGAIN - the last sign-in is older than 10 minutes (always, on the development server).
            Any other 403 is the usual problem body (the account is already closed or suspended).
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: {type: string, enum: [SIGN_IN_AGAIN, FORBIDDEN]}
