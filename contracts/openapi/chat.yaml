        skills, reminders, diary, connection, the one-to-one chat), the group chats, what the Owner
        and their Companions wrote in the community, the feedback threads and the wallet. Not in
        it: other people's content, audio, picture files, keys and tokens, anything deleted.
        At most 5 an hour and one at a time; each one is recorded. The document can be several
        megabytes: the chats together bring the newest messages up to a budget (20,000 messages,
        about 3 million characters), and each chat says in `omitted` how many older ones it leaves out.
      x-capability-status: implemented
      responses:
