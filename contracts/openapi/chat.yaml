openapi: 3.1.0
info:
  title: Companion World Owner-Companion Chat API
  version: 0.1.0
  description: |
    Private chat between the signed-in Owner and their own Companions: a one-to-one chat per
    Companion, or a group of 2 to 8 Companions. Nothing here is visible to other people or used
    for public posts.

    How replies work (like "typing…" in a messenger, no streaming):
    1. POST a message. `replying: true` means replies are on the way.
    2. While `replying` is true, GET the chat every 1-2 seconds; also GET when the app returns to
       the foreground. Show "typing…" for the Companions in `typing`. The server paces replies like
       a person: a Companion reads for 1-3 s before typing, types longer for longer messages, may
       send 1 to 3 short messages in a row, and Companions take turns. A Companion that may stay
       quiet shows no "typing…" while deciding, so `replying` can be true with `typing` empty.
    3. A reply that failed shows `status: FAILED`. `retryable: true` (failure ERROR) may be retried
       with POST .../retry. failure UNAVAILABLE means no model can answer yet ("coming soon").
       `status: BLOCKED` was stopped by the safety scan and is final.
    The Owner may keep sending while Companions reply.

    Who answers: in a one-to-one chat, the Companion always. In a group, the @mentioned Companions
    (send their ids in `mentions`) always; with no mention, each by its `groupActivity`. Then
    Companions may answer each other by their `companionInteraction`, until 8 Companion turns;
    then the chat waits for the Owner. A new Owner message stops their conversation.
servers:
- url: /v0
security:
- ownerBearer: []
paths:
  /chats:
    get:
      operationId: listChats
      summary: Every chat of the Owner, most recently active first (no paging; at most 50 groups plus one per Companion)
      x-capability-status: implemented
      responses:
        '200':
          description: Chats
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Chat'}}
        '401': &problem
          description: Problem response. 404 also covers other Owners' chats and Companions.
          content:
            application/problem+json:
              schema: {type: object}
        '403': *problem
        '501': *problem
    post:
      operationId: openChat
      summary: Open the one-to-one chat with one Companion, or create a group of 2 to 8
      description: |
        One Companion: returns its one-to-one chat, creating it on first use (no title allowed).
        Two or more: creates a new group (at most 50 per Owner, else 409); the same
        Idempotency-Key returns the same group, and with different members or title is a 409.
      x-capability-status: implemented
      parameters:
      - &idempotency
        name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [companionIds]
              properties:
                companionIds:
                  type: array
                  minItems: 1
                  maxItems: 8
                  uniqueItems: true
                  description: In this order the Companions answer when several reply at once.
                  items: {type: string, format: uuid}
                title: {type: [string, 'null'], minLength: 1, maxLength: 40, description: Groups only.}
      responses:
        '200':
          description: The chat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Chat'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
  /chats/{chatId}:
    parameters:
    - &chatId
      name: chatId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: readChat
      summary: The chat and a page of its messages, newest first (30 per page)
      x-capability-status: implemented
      parameters:
      - name: cursor
        in: query
        required: false
        description: nextCursor of the previous page, to load older messages.
        schema: {type: string}
      responses:
        '200':
          description: Chat page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatPage'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
    delete:
      operationId: deleteChat
      summary: Delete the chat and every message in it
      x-capability-status: implemented
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: {const: true}
        '401': *problem
        '403': *problem
        '404': *problem
  /chats/{chatId}/messages:
    parameters:
    - *chatId
    post:
      operationId: sendChatMessage
      summary: Send a message as the Owner
      description: |
        A retry with the same Idempotency-Key returns the first message and queues no new replies;
        the same key with different text is a 409. At most 300 Owner messages per hour (else 409).
      x-capability-status: implemented
      parameters:
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 2000, description: 'Trimmed; 1 to 2000 characters.'}
                mentions:
                  type: array
                  maxItems: 8
                  uniqueItems: true
                  description: Companions @mentioned; each must be a member of this chat.
                  items: {type: string, format: uuid}
      responses:
        '201':
          description: The message and whether replies are on the way
          content:
            application/json:
              schema:
                type: object
                required: [message, typing, replying]
                properties:
                  message: {$ref: '#/components/schemas/ChatMessage'}
                  typing: {$ref: '#/components/schemas/Typing'}
                  replying: {$ref: '#/components/schemas/Replying'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
  /chats/{chatId}/messages/{messageId}/retry:
    parameters:
    - *chatId
    - name: messageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: retryChatReply
      summary: Write a failed reply again (only when retryable is true; otherwise 409)
      x-capability-status: implemented
      responses:
        '200':
          description: The reply is being written again
          content:
            application/json:
              schema:
                type: object
                required: [typing, replying]
                properties:
                  typing: {$ref: '#/components/schemas/Typing'}
                  replying: {$ref: '#/components/schemas/Replying'}
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
  /companions/{companionId}/chat-settings:
    parameters:
    - name: companionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getChatSettings
      summary: How a Companion takes part in group chats (created with defaults on first read)
      x-capability-status: implemented
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatSettings'}
        '401': *problem
        '403': *problem
        '404': *problem
    put:
      operationId: updateChatSettings
      summary: Replace both settings; send the revision last read (a stale revision is a 409)
      x-capability-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSettings'
              unevaluatedProperties: false
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatSettings'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
components:
  securitySchemes:
    ownerBearer:
      type: http
      scheme: bearer
  schemas:
    Typing:
      type: array
      description: Companions to show as "typing…" right now.
      items: {type: string, format: uuid}
    Replying:
      type: boolean
      description: More replies are on the way; keep refreshing every 1-2 s while true, even when typing is empty.
    ChatMember:
      type: object
      required: [companionId, displayName]
      properties:
        companionId: {type: string, format: uuid}
        displayName: {type: string}
    ChatMessage:
      type: object
      required: [id, companionId, body, mentions, status, failure, retryable, sentAt]
      properties:
        id: {type: string, format: uuid}
        companionId: {type: [string, 'null'], format: uuid, description: null when the Owner wrote it.}
        body: {type: [string, 'null'], description: null when the reply failed or was blocked.}
        mentions: {type: array, items: {type: string, format: uuid}}
        status: {type: string, enum: [SENT, FAILED, BLOCKED]}
        failure:
          type: [string, 'null']
          enum: [UNAVAILABLE, ERROR, null]
          description: FAILED only. UNAVAILABLE - no model can answer yet ("coming soon"). ERROR - something went wrong.
        retryable: {type: boolean}
        sentAt: {type: string, format: date-time}
    Chat:
      type: object
      required: [id, title, direct, members, lastMessage, typing, replying, activeAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: [string, 'null'], description: Group name; always null for a one-to-one chat.}
        direct: {type: boolean, description: true for the one-to-one chat with a single Companion.}
        members: {type: array, items: {$ref: '#/components/schemas/ChatMember'}}
        lastMessage:
          oneOf:
          - $ref: '#/components/schemas/ChatMessage'
          - type: 'null'
        typing: {$ref: '#/components/schemas/Typing'}
        replying: {$ref: '#/components/schemas/Replying'}
        activeAt: {type: string, format: date-time}
    ChatPage:
      type: object
      required: [chat, items, nextCursor]
      properties:
        chat: {$ref: '#/components/schemas/Chat'}
        items: {type: array, description: Newest first., items: {$ref: '#/components/schemas/ChatMessage'}}
        nextCursor: {type: [string, 'null'], description: Pass as ?cursor= for older messages; null when there are no more.}
    ChatSettings:
      type: object
      description: How a Companion takes part in group chats. One-to-one chats always answer. Defaults NORMAL / NORMAL.
      required: [groupActivity, companionInteraction, revision]
      properties:
        groupActivity:
          type: string
          enum: [QUIET, NORMAL, ACTIVE]
          description: |
            群聊活跃度 - whether it answers the Owner when not @mentioned (an @mention is always answered).
            QUIET (安静): never. NORMAL (适中): when the message concerns it, judged by the model.
            ACTIVE (活跃): always.
        companionInteraction:
          type: string
          enum: [NONE, RARE, NORMAL, LIVELY]
          description: |
            家机互动倾向 - joining in when other Companions talk, at most 0 / 1 / 2 / 4 times per Owner
            message: NONE (不互动), RARE (偶尔), NORMAL (适中), LIVELY (热络). It may still stay quiet.
        revision: {type: integer, minimum: 1}
