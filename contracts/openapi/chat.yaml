openapi: 3.1.0
info:
  title: Companion World Owner-Companion Chat API
  version: 0.1.0
  description: |
    Private chat between the signed-in Owner and their own Companions: a one-to-one chat per
    Companion, or a group of 2 to 8 Companions. Nothing here is visible to other people or used
    for public posts.

    How replies work (like "typing…" in a messenger, no streaming):
    1. POST a message. `replying: true` means replies are on the way.
    2. While `replying` is true, GET the chat every 1-2 seconds; also GET when the app returns to
       the foreground. Show "typing…" for the Companions in `typing`. The server paces replies like
       a person: a Companion reads for 1-3 s before typing, types longer for longer messages, may
       send 1 to 3 short messages in a row, and Companions take turns. A Companion that may stay
       quiet shows no "typing…" while deciding, so `replying` can be true with `typing` empty.
    3. A reply that failed shows `status: FAILED`. `retryable: true` (failure ERROR) may be retried
       with POST .../retry. failure UNAVAILABLE: no model can answer yet ("coming soon"). DISABLED:
       the platform switched its models off for now. QUOTA: today's free replies are used up.
       `status: BLOCKED` was stopped by the safety scan (or declined by the model) and is final.
    The Owner may keep sending while Companions reply.

    Who answers: in a one-to-one chat, the Companion always. In a group, the @mentioned Companions
    (send their ids in `mentions`) always; with no mention, each by its `groupActivity`. Then
    Companions may answer each other by their `companionInteraction`, until 8 Companion turns;
    then the chat waits for the Owner. A new Owner message stops their conversation.

    Voice messages (语音): when the Owner picks a voice for a Companion (`voice` in its chat
    settings, from GET /voices), it sometimes answers with a voice message, like a person: it
    decides which. A voice message has `audio: {durationMs}` and its transcript in `body`; play GET
    .../messages/{messageId}/audio. While a Companion records one it is in both `typing` and
    `recording` (show "正在说话…"). Clips are kept 30 days, then `audio` becomes null and the
    message shows as text. Each Owner gets a limited number per day; past it, replies are text.
    The Owner sends a voice message with POST /chats/{chatId}/voice (when GET /voices says `input`).
servers:
- url: /v0
security:
- ownerBearer: []
paths:
  /chats:
    get:
      operationId: listChats
      summary: Every chat of the Owner, most recently active first (no paging; at most 50 groups plus one per Companion)
      x-capability-status: implemented
      responses:
        '200':
          description: Chats
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Chat'}}
        '401': &problem
          description: Problem response. 404 also covers other Owners' chats and Companions.
          content:
            application/problem+json:
              schema: {type: object}
        '403': *problem
        '501': *problem
    post:
      operationId: openChat
      summary: Open the one-to-one chat with one Companion, or create a group of 2 to 8
      description: |
        One Companion: returns its one-to-one chat, creating it on first use (no title allowed).
        Two or more: creates a new group (at most 50 per Owner, else 409); the same
        Idempotency-Key returns the same group, and with different members or title is a 409.
      x-capability-status: implemented
      parameters:
      - &idempotency
        name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [companionIds]
              properties:
                companionIds:
                  type: array
                  minItems: 1
                  maxItems: 8
                  uniqueItems: true
                  description: In this order the Companions answer when several reply at once.
                  items: {type: string, format: uuid}
                title: {type: [string, 'null'], minLength: 1, maxLength: 40, description: Groups only.}
      responses:
        '200':
          description: The chat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Chat'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
  /chats/{chatId}:
    parameters:
    - &chatId
      name: chatId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: readChat
      summary: The chat and a page of its messages, newest first (30 per page)
      x-capability-status: implemented
      parameters:
      - name: cursor
        in: query
        required: false
        description: nextCursor of the previous page, to load older messages.
        schema: {type: string}
      responses:
        '200':
          description: Chat page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatPage'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
    delete:
      operationId: deleteChat
      summary: Delete the chat and every message in it
      x-capability-status: implemented
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: {const: true}
        '401': *problem
        '403': *problem
        '404': *problem
  /chats/{chatId}/read:
    parameters:
    - *chatId
    put:
      operationId: markChatRead
      summary: The Owner has read up to this message (kept on the server, so it carries across devices)
      description: |
        Send the newest message the Owner has seen. The read position only moves forward: an older
        message than the saved one changes nothing, so devices may report in any order. Returns the
        chat with its new unreadCount. 404 when the message is not a shown message of this chat.
      x-capability-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId]
              additionalProperties: false
              properties:
                messageId: {type: string, format: uuid}
      responses:
        '200':
          description: The chat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Chat'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
  /badges:
    get:
      operationId: getBadges
      summary: Every unread count for the tab badges in one call
      x-capability-status: implemented
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Badges'}
        '401': *problem
        '403': *problem
  /wallet:
    get:
      operationId: getWallet
      summary: The Owner's credits for platform models
      description: |
        While the platform has not turned the wallet on, only `{enabled: false}`. Otherwise the first
        read also grants the welcome gift (once). A platform model call holds credits before it starts
        (cost in cents x creditsPerCent) and gives back what it did not use; a failed call costs nothing.
        Too few credits: the reply fails as QUOTA. Owner-key and own-agent replies use no credits.
      x-capability-status: implemented
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: {type: boolean}
                  state: {type: string, enum: [ACTIVE, FROZEN]}
                  available: {type: integer, minimum: 0}
                  freeCredits: {type: integer, minimum: 0}
                  paidCredits: {type: integer, minimum: 0}
                  reserved: {type: integer, minimum: 0}
                  creditsPerCent: {type: integer, minimum: 1}
                  priceVersion: {type: string}
                  version: {type: integer, minimum: 1}
        '401': *problem
        '403': *problem
  /feedback:
    get:
      operationId: listFeedback
      summary: The Owner's feedback threads (意见反馈), most recently active first (at most 50)
      description: |
        Each thread is the Owner's first message, then the team's answers (author TEAM) and the Owner's
        follow-ups, oldest first. `unread` is true when the team wrote since the Owner last opened the
        thread (PUT .../read); GET /v0/badges counts such threads as `feedback`. CLOSED means the team
        handled it; a follow-up opens it again.
      x-capability-status: implemented
      responses:
        '200':
          description: Threads
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Feedback'}}
        '401': *problem
        '403': *problem
    post:
      operationId: sendFeedback
      summary: Open a feedback thread (1-2000 characters); 409 INVALID_STATE past 20 messages a day
      description: |
        The same Idempotency-Key returns the first thread; with other text it is a 409. `appVersion`
        and `platform` are optional and only help the team tell which build a problem is in.
      x-capability-status: implemented
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body: {type: string, minLength: 1, maxLength: 2000}
                appVersion: {type: [string, 'null'], maxLength: 40}
                platform: {type: [string, 'null'], enum: [IOS, ANDROID, WEB, null]}
      responses:
        '201':
          description: The new thread
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feedback'}
        '400': *problem
        '401': *problem
        '403': *problem
        '409': *problem
  /feedback/{feedbackId}/messages:
    parameters:
    - name: feedbackId
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: addFeedbackMessage
      summary: A follow-up in one of the Owner's threads (opens a closed one again; counts as read)
      x-capability-status: implemented
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '201':
          description: The thread
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feedback'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
  /feedback/{feedbackId}/read:
    parameters:
    - name: feedbackId
      in: path
      required: true
      schema: {type: string, format: uuid}
    put:
      operationId: readFeedback
      summary: The Owner opened the thread; the team's answers so far are read
      x-capability-status: implemented
      responses:
        '200':
          description: The thread
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feedback'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
  /features:
    get:
      operationId: getFeatures
      summary: What the app may offer right now; hide what is false
      description: |
        groupChatCreate false: POST /chats with 2 or more Companions answers 409. groupChatSend false:
        existing group chats can be read and deleted, but sending and retrying in them answer 409.
        connections false: PUT .../connection answers 501. voiceInput false: POST /chats/{id}/voice
        answers 503 (the same as `input` in GET /voices). companionReach false: no Companion writes
        first and no reminder is set or delivered, whatever `proactive` says - hide that setting.
      x-capability-status: implemented
      responses:
        '200':
          description: Features
          content:
            application/json:
              schema:
                type: object
                required: [groupChatCreate, groupChatSend, connections]
                properties:
                  groupChatCreate: {type: boolean}
                  groupChatSend: {type: boolean}
                  connections: {type: boolean}
                  voiceInput: {type: boolean}
                  companionReach: {type: boolean}
        '401': *problem
        '403': *problem
  /companions/{companionId}/anniversary:
    parameters:
    - name: companionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getAnniversary
      summary: The day the Owner and this Companion count from (相伴起始日); startDate null when not set
      x-capability-status: implemented
      responses:
        '200':
          description: Anniversary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Anniversary'}
        '401': *problem
        '403': *problem
        '404': *problem
    put:
      operationId: updateAnniversary
      summary: Set the date, or clear it with startDate null; send the revision last read (a stale revision is a 409)
      description: |
        startDate is a calendar date in timeZone (an IANA name such as Asia/Shanghai), from 1900-01-01
        up to today there; it may be long before the account existed.
      x-capability-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, timeZone, revision]
              additionalProperties: false
              properties:
                startDate: {type: [string, 'null'], format: date}
                timeZone: {type: string}
                revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Anniversary'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
  /chats/{chatId}/messages:
    parameters:
    - *chatId
    post:
      operationId: sendChatMessage
      summary: Send a message as the Owner
      description: |
        A retry with the same Idempotency-Key returns the first message and queues no new replies;
        the same key with different text or pictures is a 409. At most 300 Owner messages per hour (else 409).

        Pictures (图片) - upload each file first, with the Owner's own sign-in, to the Storage bucket
        `media` as `chat/<uuid>.jpg|png|webp` (1 MB at most), then name 1 to 4 of them in `images`. With
        pictures `body` may be left out (the message then has the body "[图片]"). A file that is not
        there, is not this Owner's or is on a message already is a 400. Past the day's pictures
        (30 per Owner) the answer is 429 IMAGE_LIMIT and nothing is sent.
      x-capability-status: implemented
      parameters:
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                body: {type: string, maxLength: 2000, description: 'Trimmed; 1 to 2000 characters. Required unless there are pictures.'}
                images:
                  type: array
                  maxItems: 4
                  description: Pictures uploaded beforehand, in the order they are shown.
                  items:
                    type: object
                    additionalProperties: false
                    required: [path]
                    properties:
                      path: {type: string, pattern: '^chat/[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}[.](jpg|png|webp)$'}
                      width: {type: integer, minimum: 1, maximum: 99999}
                      height: {type: integer, minimum: 1, maximum: 99999}
                mentions:
                  type: array
                  maxItems: 8
                  uniqueItems: true
                  description: Companions @mentioned; each must be a member of this chat.
                  items: {type: string, format: uuid}
      responses:
        '201':
          description: The message and whether replies are on the way
          content:
            application/json:
              schema:
                type: object
                required: [message, typing, replying]
                properties:
                  message: {$ref: '#/components/schemas/ChatMessage'}
                  typing: {$ref: '#/components/schemas/Typing'}
                  replying: {$ref: '#/components/schemas/Replying'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
        '429':
          description: IMAGE_LIMIT - the day's pictures are used up; nothing was sent
  /chats/{chatId}/messages/{messageId}/retry:
    parameters:
    - *chatId
    - name: messageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: retryChatReply
      summary: Write a failed reply again (only when retryable is true; otherwise 409)
      x-capability-status: implemented
      responses:
        '200':
          description: The reply is being written again
          content:
            application/json:
              schema:
                type: object
                required: [typing, replying]
                properties:
                  typing: {$ref: '#/components/schemas/Typing'}
                  replying: {$ref: '#/components/schemas/Replying'}
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
  /chats/{chatId}/messages/{messageId}/audio:
    parameters:
    - *chatId
    - name: messageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getChatMessageAudio
      summary: The audio of a voice message (one with `audio` set)
      description: |
        audio/mpeg (audio/wav on the development host). Supports a single `Range: bytes=start-end`
        (206 with Content-Range, 416 when outside the clip). 404 for a text message, an expired clip,
        or a message not shown yet. Send the Authorization header like every other call.
      x-capability-status: implemented
      parameters:
      - name: Range
        in: header
        required: false
        schema: {type: string, example: bytes=0-1023}
      responses:
        '200':
          description: The whole clip
          content:
            audio/mpeg:
              schema: {type: string, format: binary}
            audio/wav:
              schema: {type: string, format: binary}
        '206':
          description: The requested part
          content:
            audio/mpeg:
              schema: {type: string, format: binary}
        '401': *problem
        '403': *problem
        '404': *problem
        '416':
          description: The range is outside the clip
  /chats/{chatId}/voice:
    parameters:
    - *chatId
    post:
      operationId: sendChatVoice
      summary: The Owner sends a voice message
      description: |
        The server turns the recording into text and sends it like POST .../messages (no @mentions):
        the message has `audio` and `body` is what was recognised. Record mono AAC (m4a, about
        32 kbit/s), at most 60 s and 700 KB. A retry with the same Idempotency-Key returns the first
        message. 422 VOICE_NOT_UNDERSTOOD - nothing could be heard. 429 VOICE_LIMIT - today's voice
        messages are used up. 503 VOICE_UNAVAILABLE - speech recognition is off or failed (try again or type).
      x-capability-status: implemented
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audio, mime, durationMs]
              properties:
                audio: {type: string, contentEncoding: base64, description: The recording.}
                mime: {type: string, enum: [audio/mp4, audio/aac, audio/mpeg, audio/wav, audio/ogg]}
                durationMs: {type: integer, minimum: 1, maximum: 60000}
      responses:
        '201':
          description: Sent; replies are on the way when `replying` is true
          content:
            application/json:
              schema:
                type: object
                required: [message, typing, replying]
                properties:
                  message: {$ref: '#/components/schemas/ChatMessage'}
                  typing: {$ref: '#/components/schemas/Typing'}
                  replying: {$ref: '#/components/schemas/Replying'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
        '422':
          description: VOICE_NOT_UNDERSTOOD
        '429':
          description: VOICE_LIMIT
        '503':
          description: VOICE_UNAVAILABLE
  /voices:
    get:
      operationId: listVoices
      summary: The voices an Owner can pick for a Companion
      description: |
        `available: false` means voice messages are not switched on on this server: hide the voice
        picker (a Companion with a voice set then answers in text).
      x-capability-status: implemented
      responses:
        '200':
          description: Voices
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VoiceList'}
        '401': *problem
        '403': *problem
  /voices/{voiceId}/sample:
    parameters:
    - name: voiceId
      in: path
      required: true
      schema: {type: string}
    get:
      operationId: getVoiceSample
      summary: Hear a voice say a short sample line (made once per server, then cached)
      x-capability-status: implemented
      responses:
        '200':
          description: The sample
          content:
            audio/mpeg:
              schema: {type: string, format: binary}
        '401': *problem
        '403': *problem
        '404': *problem
        '503': *problem
  /chat-models:
    get:
      operationId: listChatModels
      summary: The models an Owner can pick for a Companion
      description: |
        The models the platform offers: only those it has an API key for. `available: false` means
        switched off by the platform for now; a Companion set to such a model answers with the
        platform default. Empty when the platform offers no model yet.
      x-capability-status: implemented
      responses:
        '200':
          description: Models
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatModelList'}
        '401': *problem
        '403': *problem
  /companions/{companionId}/chat-settings:
    parameters:
    - name: companionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getChatSettings
      summary: How a Companion takes part in group chats (created with defaults on first read)
      x-capability-status: implemented
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatSettings'}
        '401': *problem
        '403': *problem
        '404': *problem
    put:
      operationId: updateChatSettings
      summary: Replace both settings; send the revision last read (a stale revision is a 409)
      x-capability-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSettings'
              unevaluatedProperties: false
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatSettings'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
  /companions/{companionId}/actions:
    parameters:
    - name: companionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: doCompanionAction
      summary: A home-room action (wave, pat, hug, cuddle), kept in the one-to-one chat with the Companion
      description: |
        Play the animation at once; this only records it. The action becomes a message in the
        one-to-one chat (created on first use) with `action` set and no body, so the Companion sees
        it among the recent messages it reads before replying. The first action of a burst lets the
        Companion answer with a line or stay quiet; actions less than 3 minutes after the previous
        one, or while a reply is on the way, queue nothing (`replying` may still be true for that earlier reply). To show the answer,
        GET /chats/{chatId} while `replying` is true. The same Idempotency-Key returns the first
        result; with another action, or a key used for a message, it is a 409. Counts toward the
        300 Owner messages per hour.
      x-capability-status: implemented
      parameters:
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: {$ref: '#/components/schemas/CompanionAction'}
      responses:
        '201':
          description: The action as a chat message, the chat it is in, and whether a reply is on the way
          content:
            application/json:
              schema:
                type: object
                required: [chatId, message, typing, replying]
                properties:
                  chatId: {type: string, format: uuid}
                  message: {$ref: '#/components/schemas/ChatMessage'}
                  typing: {$ref: '#/components/schemas/Typing'}
                  replying: {$ref: '#/components/schemas/Replying'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
        '409': *problem
  /companions/{companionId}/diary:
    parameters:
    - name: companionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: listDiary
      summary: The Companion's diary (家机日记), newest first, 20 per page
      x-capability-status: implemented
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: A page of entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiaryPage'}
        '400': *problem
        '401': *problem
        '403': *problem
        '404': *problem
    post:
      operationId: writeDiary
      summary: Write an entry if one is due (send when the Owner opens the diary; waits for the model)
      description: |
        No body and no Idempotency-Key. The server decides: an entry is written only if the
        Companion's frequency says one is due (counted from the previous entry) and something happened
        since then: messages or home-room actions in the one-to-one chat, or the Companion's own
