name: foundation-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm install --prefix frontend --ignore-scripts
      - run: npm run check --prefix frontend
      - run: npm run export:ci --prefix frontend
      - run: npm run export:web:ci --prefix frontend

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: companion_social
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d companion_social"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/companion_social
      COMPANION_SOCIAL_TEST_DATABASE: 1
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash backend/scripts/test-postgres.sh
      - name: Create disposable mobile dev database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database companion_social_mobile_dev_ci"
      - name: Validate Stage 1 mobile dev database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/companion_social_mobile_dev_ci
          COMPANION_SOCIAL_DEV_DATABASE: 1
        run: npm run dev:mobile:db:init
      - name: Verify mobile HTTP and account isolation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/companion_social_mobile_dev_ci
          COMPANION_SOCIAL_DEV_DATABASE: 1
        run: bash scripts/ci/mobile-dev-gates.sh
