name: decisionbench-spike

on:
  push:
    branches: [main]
    paths:
      - "spikes/decisionbench/**"
      - ".github/workflows/decisionbench.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: DecisionBench tests
        run: node --experimental-strip-types --test spikes/decisionbench/test.ts
      - name: DecisionBench benchmark
        run: npm run decisionbench
